[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mygpt"
version = "0.1.0"
description = "Independent 0.5B-parameter decoder-only LLM, built from scratch for CPU inference"
requires-python = ">=3.10"
dependencies = ["torch>=2.4", "numpy>=1.26", "safetensors>=0.4"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["model", "tokenizer", "initialization", "tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
